<script>

const BANK={"course":"Ôn tập Tin học 12","lessons":[{"id":"bai-1","number":1,"title":"LÀM QUEN VỚI TRÍ TUỆ NHÂN TẠO","questions":[{"id":"1","type":"mcq","stem":"AI (Trí tuệ nhân tạo) là gì?","choices":["Hệ thống tự động","Khả năng của máy tính thực hiện các công việc mang tính trí tuệ của con người","Phần mềm diệt virus","Ứng dụng điện thoại thông minh"],"answer":"B","explanation":"AI là khả năng của máy tính để thực hiện các công việc mà thường đòi hỏi trí tuệ của con người, như đọc chữ, hiểu tiếng nói, dịch thuật, lái xe, học hỏi và ra quyết định."},{"id":"2","type":"mcq","stem":"Mục đích chính của AI là gì?","choices":["Xây dựng các phần mềm diệt virus","Xây dựng các phần mềm giúp máy tính có năng lực trí tuệ tương tự con người","Tạo ra các ứng dụng giải trí","Phát triển các trò chơi điện tử"],"answer":"B","explanation":"Mục đích chính của AI là xây dựng phần mềm giúp máy tính có năng lực trí tuệ tương tự con người."},{"id":"3","type":"mcq","stem":"Khả năng nào của AI cho phép máy tính điều chỉnh hành vi dựa trên dữ liệu mới?","choices":["Khả năng suy luận","Khả năng học","Khả năng nhận thức","Khả năng giải quyết vấn đề"],"answer":"B","explanation":"Khả năng học của AI cho phép máy tính điều chỉnh hành vi dựa trên dữ liệu mới, giống như hệ thống khuyến nghị của YouTube."},{"id":"4","type":"mcq","stem":"Hệ thống nào sau đây là ví dụ về khả năng suy luận của AI?","choices":["Hệ thống khuyến nghị YouTube","Hệ thống chẩn đoán y tế","Máy tính điều khiển xe tự lái","Công cụ tìm kiếm Google"],"answer":"B","explanation":"Hệ thống chẩn đoán y tế là ví dụ về khả năng suy luận của AI, nơi AI áp dụng logic và tri thức để đưa ra quyết định y tế."},{"id":"5","type":"mcq","stem":"Khả năng nhận thức của AI là gì?","choices":["Điều chỉnh hành vi dựa trên dữ liệu mới","Áp dụng logic để đưa ra quyết định","Cảm nhận và hiểu biết môi trường qua cảm biến","Xử lí ngôn ngữ tự nhiên"],"answer":"C","explanation":"Khả năng nhận thức của AI là khả năng cảm nhận và hiểu biết môi trường qua cảm biến, như máy tính điều khiển xe tự lái."},{"id":"6","type":"mcq","stem":"AI khác biệt so với tự động hóa như thế nào?","choices":["AI yêu cầu sự kết hợp của nhiều đặc trưng trí tuệ để thực hiện các nhiệm vụ phức tạp","AI chỉ thực hiện được một nhiệm vụ duy nhất","Tự động hóa không yêu cầu sự can thiệp của con người","Tự động hóa chỉ áp dụng trong lĩnh vực công nghiệp"],"answer":"A","explanation":"AI yêu cầu sự kết hợp của nhiều đặc trưng trí tuệ để thực hiện các nhiệm vụ phức tạp, trong khi tự động hóa thường không đòi hỏi khả năng trí tuệ phức tạp như AI."},{"id":"7","type":"mcq","stem":"Trí tuệ nhân tạo được thiết kế để thực hiện nhiệm vụ nào sau đây?","choices":["Tự học và thực hiện nhiều công việc giống con người","Chơi cờ và nhận dạng khuôn mặt","Chăm sóc sức khỏe","Dự báo thời tiết"],"answer":"A","explanation":"Trí tuệ nhân tạo được thiết kế để thực hiện một nhiệm vụ cụ thể như Tự học và thực hiện nhiều công việc giống con người.","reviewNote":"Cách diễn đạt và giải thích trong nguồn dễ gây nhầm giữa AI hẹp và AI tổng quát; cần giáo viên rà soát."},{"id":"8","type":"mcq","stem":"Hệ chuyên gia MYCIN được sử dụng trong lĩnh vực nào?","choices":["Công nghiệp","Y học","Tài chính","Giáo dục"],"answer":"B","explanation":"Hệ chuyên gia MYCIN được sử dụng trong lĩnh vực y học để mô phỏng khả năng ra quyết định của các chuyên gia."},{"id":"9","type":"mcq","stem":"Robot Asimo của Honda là ví dụ của ứng dụng AI trong lĩnh vực nào?","choices":["Trò chơi điện tử","Dịch vụ khách hàng","Công nghiệp","Điều khiển robot"],"answer":"D","explanation":"Robot Asimo của Honda là ví dụ về ứng dụng AI trong điều khiển robot, với khả năng tự động điều khiển, nhận dạng hình ảnh và tiếng nói."},{"id":"10","type":"mcq","stem":"Google Dịch là một ví dụ của khả năng nào trong AI?","choices":["Khả năng học","Khả năng suy luận","Khả năng nhận thức","Khả năng hiểu ngôn ngữ"],"answer":"D","explanation":"Google Dịch là một ví dụ của khả năng hiểu ngôn ngữ trong AI, nơi AI xử lí ngôn ngữ tự nhiên để dịch các văn bản giữa các ngôn ngữ khác nhau."},{"id":"1","type":"tf","stem":"Các phát biểu sau đây đúng hay sai khi nói về khái niệm và đặc trưng của AI:","items":[{"label":"a","text":"AI là khả năng của máy tính thực hiện các công việc mang tính trí tuệ của con người.","answer":"Đ","explanation":"Đúng"},{"label":"b","text":"Mục đích của AI là xây dựng các phần mềm giúp máy tính có năng lực trí tuệ tương tự con người.","answer":"Đ","explanation":"Đúng"},{"label":"c","text":"Khả năng học của AI cho phép máy tính ra quyết định dựa trên dữ liệu mới.","answer":"S","explanation":"Sai vì Khả năng học của AI cho phép máy tính điều chỉnh hành vi dựa trên dữ liệu mới, không phải ra quyết định (đây là khả năng suy luận)."},{"label":"d","text":"Khả năng nhận thức của AI là khả năng xử lí ngôn ngữ tự nhiên.","answer":"S","explanation":"Sai vì Khả năng nhận thức của AI là khả năng cảm nhận và hiểu biết môi trường qua cảm biến, trong khi khả năng xử lí ngôn ngữ tự nhiên là khả năng hiểu ngôn ngữ."}]},{"id":"2","type":"tf","stem":"Phát biểu dưới đây đúng hay sai khi nói về các loại và ứng dụng của AI:","items":[{"label":"a","text":"Trí tuệ nhân tạo hẹp được thiết kế để thực hiện nhiều nhiệm vụ phức tạp giống con người.","answer":"S","explanation":"Sai vì Trí tuệ nhân tạo hẹp được thiết kế để thực hiện một nhiệm vụ cụ thể như chơi cờ hay nhận dạng khuôn mặt, không phải nhiều nhiệm vụ phức tạp."},{"label":"b","text":"Trí tuệ nhân tạo tổng quát là mục tiêu dài hạn, có khả năng tự học và thực hiện nhiều công việc giống con người.","answer":"Đ","explanation":"Đúng vì Trí tuệ nhân tạo tổng quát đang là mục tiêu dài hạn với khả năng tự học và thực hiện nhiều công việc giống con người."},{"label":"c","text":"Hệ chuyên gia MYCIN được sử dụng để dự báo thời tiết.","answer":"S","explanation":"Sai vì Hệ chuyên gia MYCIN được sử dụng trong lĩnh vực y học để mô phỏng khả năng ra quyết định của các chuyên gia y tế."},{"label":"d","text":"Robot Asimo của Honda là một ví dụ về ứng dụng AI trong điều khiển robot.","answer":"Đ","explanation":"Đúng vì Robot Asimo của Honda là một ví dụ điển hình về ứng dụng AI trong điều khiển robot, với khả năng tự động điều khiển và nhận dạng hình ảnh, tiếng nói."}]}],"notes":[]},{"id":"bai-2","number":2,"title":"TRÍ TUỆ NHÂN TẠO TRONG KHOA HỌC VÀ ĐỜI SỐNG","questions":[{"id":"1","type":"mcq","stem":"Lĩnh vực nào sau đây phát triển nhờ ứng dụng AI?","choices":["Nông nghiệp","Chế biến thực phẩm","Phát triển người máy thông minh","Nghề thủ công"],"answer":"C","explanation":"AI được ứng dụng mạnh mẽ trong phát triển robot thông minh, như robot Grace ở Hồng Kông.","reviewNote":"Nhiều lĩnh vực trong các lựa chọn đều có thể ứng dụng AI; câu hỏi chưa bảo đảm chỉ có một đáp án đúng. Không tính điểm câu này.","excludeScore":true},{"id":"2","type":"mcq","stem":"AI giúp phát triển điều khiển tự động trong lĩnh vực nào?","choices":["Nấu ăn tự động","Quản lý tài chính","Thiết bị bay không người lái","Đào tạo nhân sự"],"answer":"C","explanation":"AI giúp phát triển điều khiển tự động, ví dụ như trong các thiết bị bay không người lái."},{"id":"3","type":"mcq","stem":"Sản phẩm nào dưới đây không được phát triển nhờ AI?","choices":["Nhận dạng vân tay","Điều hoà không khí tự động","Trợ lý ảo như Siri","Chatbot hỗ trợ khách hàng"],"answer":"B","explanation":"Điều hoà không khí tự động không liên quan trực tiếp đến AI như các sản phẩm khác được liệt kê."},{"id":"4","type":"mcq","stem":"AI có thể được ứng dụng trong dịch vụ nào?","choices":["Chẩn đoán bệnh bằng DeepMind","Sản xuất thuốc bằng máy móc","Dịch vụ vận chuyển hàng hóa","Dịch vụ sửa chữa ô tô"],"answer":"A","explanation":"AI được sử dụng để phân tích hành vi, phát hiện gian lận trong lĩnh vực tài chính. (Ghi chú: Giải thích gốc có thể đang tham khảo đến dịch vụ tài chính, nhưng trong các đáp án, A là ứng dụng AI rõ nét nhất)."},{"id":"5","type":"mcq","stem":"Ứng dụng nào dưới đây liên quan đến AI trong y tế?","choices":["Chẩn đoán bệnh bằng DeepMind","Sản xuất thuốc bằng máy móc","Vận hành bệnh viện tự động","Quản lý dược phẩm"],"answer":"A","explanation":"DeepMind của Google được ứng dụng trong chẩn đoán y khoa."},{"id":"6","type":"mcq","stem":"Một cảnh báo về ứng dụng AI là gì?","choices":["Tăng cường bảo mật dữ liệu","Tạo ra nhiều việc làm mới","Đe dọa an ninh hệ thống","Giảm bớt sự phân biệt đối xử"],"answer":"C","explanation":"Một trong những cảnh báo về AI là khả năng bị tấn công, xâm nhập hệ thống."},{"id":"7","type":"mcq","stem":"Lợi ích của AI trong giáo dục và đào tạo là gì?","choices":["Tăng chi phí giáo dục","Cá nhân hoá học tập","Giảm chất lượng giảng dạy","Tăng áp lực cho học viên"],"answer":"B","explanation":"AI có thể tạo ra các hệ thống học tập cá nhân hoá như Elearning."},{"id":"8","type":"mcq","stem":"Công nghệ nào của Google Drive liên quan đến AI?","choices":["Lưu trữ đám mây","Nhận dạng chữ viết tay (OCR)","Chỉnh sửa văn bản","Bảo mật dữ liệu"],"answer":"B","explanation":"Google Drive sử dụng OCR để chuyển đổi chữ viết tay thành văn bản."},{"id":"9","type":"mcq","stem":"AI có thể ảnh hưởng đến lĩnh vực tài chính như thế nào?","choices":["Tạo ra sản phẩm mới","Phân tích hành vi tài chính để phát hiện gian lận","Quản lý quỹ đầu tư","Điều hành ngân hàng"],"answer":"B","explanation":"AI giúp phát hiện các giao dịch đáng ngờ, gian lận trong tài chính."},{"id":"10","type":"mcq","stem":"Giải pháp nào cần thiết để giám sát và đảm bảo an toàn trong phát triển AI?","choices":["Tăng cường sự minh bạch","Giảm thiểu chi phí phát triển","Hạn chế nghiên cứu AI","Tăng cường sự phát triển của công nghệ"],"answer":"A","explanation":"Minh bạch và giám sát là cần thiết để đảm bảo an toàn trong phát triển AI."},{"id":"1","type":"tf","stem":"Một số lĩnh vực phát triển nhờ ứng dụng AI đúng hay sai?","items":[{"label":"a","text":"AI giúp phát triển người máy thông minh","answer":"Đ","explanation":"Đúng: AI được sử dụng trong lĩnh vực Robotics để phát triển robot thông minh. Ví dụ, robot Grace ở Hồng Kông có khả năng chăm sóc bệnh nhân và giao tiếp đa ngôn ngữ."},{"label":"b","text":"AI giúp phát triển điều khiển tự động","answer":"Đ","explanation":"Đúng: AI hỗ trợ trong việc tự động hóa các máy móc và thiết bị, giúp chúng hoạt động mà không cần sự can thiệp của con người. Các ứng dụng bao gồm giám sát nguyên vật liệu, quét sản phẩm lỗi, và thiết bị bay không người lái."},{"label":"c","text":"AI giúp phát triển một số sản phẩm, tiện ích thông minh","answer":"Đ","explanation":"Đúng: AI đã góp phần phát triển các sản phẩm và tiện ích như nhận dạng vân tay và khuôn mặt trên điện thoại, và OCR của Google Drive để chuyển đổi chữ viết tay từ ảnh và PDF sang văn bản."},{"label":"d","text":"AI giúp phát triển các dịch vụ","answer":"Đ","explanation":"Đúng: AI đã tạo ra các trợ lý ảo và chatbot, hỗ trợ trong các lĩnh vực khác nhau như dịch vụ khách hàng, tài chính ngân hàng, y tế, và giáo dục. Ví dụ, DeepMind của Google giúp chẩn đoán bệnh và lập phác đồ điều trị."}]},{"id":"2","type":"tf","stem":"Phát biểu sau đây đúng hay sai cảnh báo về ứng dụng AI?","items":[{"label":"a","text":"AI có khả năng tự động hoá nhiều công việc, dẫn đến áp lực thất nghiệp","answer":"Đ","explanation":"Đúng: AI có thể tự động hóa nhiều công việc, dẫn đến tình trạng mất việc làm cho một số người lao động."},{"label":"b","text":"Vi phạm quyền riêng tư khi dữ liệu cá nhân bị lạm dụng","answer":"Đ","explanation":"Đúng: Việc thu thập và sử dụng dữ liệu cá nhân không đúng quy định có thể xâm phạm quyền riêng tư của người dùng."},{"label":"c","text":"Đe dọa an ninh hệ thống khi bị tấn công xâm nhập hoặc thay đổi dữ liệu","answer":"Đ","explanation":"Đúng: Các hệ thống AI có thể bị tấn công và xâm nhập, gây ra rủi ro về an ninh và thay đổi dữ liệu."},{"label":"d","text":"Có thể kiểm soát hoặc thay đổi ý thức, hành vi con người một cách không mong muốn","answer":"Đ","explanation":"Đúng: AI có khả năng ảnh hưởng đến ý thức và hành vi của con người, đôi khi theo cách không mong muốn."}]}],"notes":[]},{"id":"bai-3","number":3,"title":"MỘT SỐ THIẾT BỊ MẠNG THÔNG DỤNG","questions":[{"id":"1","type":"mcq","stem":"Thiết bị nào hoạt động tại tầng vật lý của mô hình OSI và chuyển tiếp dữ liệu đến tất cả các thiết bị:","choices":["Hub","Switch","Router","Modem"],"answer":"A","explanation":"Hub hoạt động tại tầng vật lý và phát tín hiệu đến tất cả các thiết bị kết nối, không phân biệt địa chỉ."},{"id":"2","type":"mcq","stem":"Thiết bị nào có khả năng chuyển tiếp dữ liệu chỉ đến thiết bị đích mà không phải gửi đến tất cả các thiết bị khác trong mạng?","choices":["Hub","Switch","Router","Modem"],"answer":"B","explanation":"Switch hoạt động tại tầng dữ liệu và sử dụng địa chỉ MAC để chuyển dữ liệu trực tiếp đến thiết bị đích, giảm xung đột tín hiệu."},{"id":"3","type":"mcq","stem":"Thiết bị nào có chức năng dẫn đường cho dữ liệu khi kết nối trên mạng Internet?","choices":["Hub","Switch","Router","Modem"],"answer":"C","explanation":"Router định tuyến các gói dữ liệu giữa các mạng khác nhau, đặc biệt là giữa mạng nội bộ (LAN) và Internet."},{"id":"4","type":"mcq","stem":"Thiết bị nào chuyển đổi tín hiệu từ tín hiệu số sang tín hiệu tương tự và ngược lại, thường dùng khi kết nối LAN với Internet?","choices":["Hub","Switch","Router","Modem"],"answer":"D","explanation":"Modem chuyển đổi tín hiệu số thành tín hiệu tương tự và ngược lại để truyền dữ liệu qua các hệ thống mạng khác nhau, đặc biệt là qua các đường dây điện thoại hoặc cáp quang."},{"id":"5","type":"mcq","stem":"Bộ thu phát Wi-Fi còn được gọi là gì?","choices":["Hub","Switch","Access Point","Modem"],"answer":"C","explanation":"Bộ thu phát Wi-Fi, còn gọi là Access Point (AP), cho phép các thiết bị không dây kết nối vào mạng."},{"id":"6","type":"mcq","stem":"Thiết bị nào sử dụng địa chỉ MAC để định tuyến dữ liệu trong mạng LAN?","choices":["Hub","Switch","Router","Modem"],"answer":"B","explanation":"Switch sử dụng địa chỉ MAC của các thiết bị để định tuyến dữ liệu chỉ đến thiết bị đích, không gửi đến tất cả các thiết bị khác."},{"id":"7","type":"mcq","stem":"Để mở rộng phạm vi của một mạng LAN không dây, thiết bị nào thường được sử dụng?","choices":["Hub","Switch","Router","Access Point"],"answer":"D","explanation":"Access Point có thể mở rộng phạm vi của mạng không dây bằng cách cho phép nhiều thiết bị kết nối vào mạng."},{"id":"8","type":"mcq","stem":"Thiết bị nào thường có nhiều cổng WAN và được nhà cung cấp dịch vụ Internet sử dụng để chuyển dữ liệu?","choices":["Hub","Switch","Router","Modem"],"answer":"C","explanation":"Router có nhiều cổng WAN và được sử dụng để chuyển dữ liệu qua mạng Internet, đặc biệt là trong các mạng lớn hoặc của các nhà cung cấp dịch vụ."},{"id":"9","type":"mcq","stem":"Trên thiết bị Android, làm thế nào để kết nối vào mạng Wi-Fi?","choices":["Vuốt màn hình từ trên xuống, chọn biểu tượng cài đặt, sau đó chọn biểu tượng kết nối Wi-Fi","Nhấn nút Home ba lần liên tiếp","Vuốt màn hình từ dưới lên, chọn biểu tượng Bluetooth","Chọn biểu tượng mạng trên thanh trạng thái"],"answer":"A","explanation":"Trên thiết bị Android, vuốt màn hình từ trên xuống và chọn cài đặt Wi-Fi để kết nối."},{"id":"10","type":"mcq","stem":"Nếu một trạm Wi-Fi có biểu tượng khóa, điều này có nghĩa là gì?","choices":["Trạm không có kết nối Internet","Trạm yêu cầu mật khẩu để kết nối","Trạm chỉ cho phép các thiết bị có địa chỉ MAC cụ thể kết nối","Trạm không hoạt động"],"answer":"B","explanation":"Biểu tượng khóa cho thấy trạm Wi-Fi yêu cầu nhập mật khẩu để kết nối, đảm bảo an toàn cho mạng."},{"id":"1","type":"tf","stem":"Phát biểu sau đây đúng hay sai khi nói về thiết bị mạng thông dụng","items":[{"label":"a","text":"Hub và switch:\n- Hub: hoạt động tại tầng vật lý của mạng và chuyển tiếp dữ liệu đến tất cả các thiết bị kết nối. Nguy cơ xung đột tín hiệu cao.\n- Switch: hoạt động tại tầng dữ liệu, có khả năng chuyển tiếp dữ liệu chỉ đến thiết bị đích mà không phải gửi đến tất cả các thiết bị khác trong mạng. Không gây xung đột với tín hiệu của các cuộc truyền ở cổng khác.","answer":"Đ","explanation":"Hub và switch:\n Đúng - Hub hoạt động tại tầng vật lý và chuyển tiếp dữ liệu đến tất cả các thiết bị, dẫn đến nguy cơ xung đột tín hiệu.\n Đúng - Switch hoạt động tại tầng liên kết dữ liệu và chỉ chuyển tiếp dữ liệu đến thiết bị đích, giúp giảm thiểu xung đột tín hiệu."},{"label":"b","text":"Wireless access point:\n- Wi-Fi (Wireless Fidelity) truyền dữ liệu bằng sóng vô tuyến, phổ biến trong các mạng cục bộ.\n- Để thiết lập một LAN đơn giản, ta có thể sử dụng bộ thu phát Wi-Fi để kết nối các thiết bị đầu cuối trong một khu vực mà không cần hub, switch hay cáp mạng.\n- Bộ thu phát Wi-Fi còn được gọi là \"điểm truy cập không dây\" (Wireless Access Point - WAP, hoặc Access Point - AP). Mở rộng LAN có thể được thực hiện bằng cách kết nối không dây các thiết bị di động thông qua WAP, mở rộng phạm vi địa lý của mạng.","answer":"Đ","explanation":"Wireless access point:\n Đúng - Wi-Fi sử dụng sóng vô tuyến để truyền dữ liệu và phổ biến trong mạng cục bộ.\n Đúng - Bộ thu phát Wi-Fi (WAP) có thể tạo một mạng LAN không dây mà không cần hub, switch hay cáp mạng."},{"label":"c","text":"Router:\n- Dùng để dẫn đường cho dữ liệu khi kết nối trên mạng Internet.\n- Khi kết nối hai máy tính qua Internet từ xa, không thể sử dụng hub hay switch mà phải dùng dịch vụ của nhà cung cấp viễn thông.\n- Mạng viễn thông sử dụng router để chuyển dữ liệu. Router nhà cung cấp dịch vụ Internet thường có nhiều cổng WAN, còn router gia đình thường chỉ có một cổng WAN và tích hợp Wi-Fi, gọi là router Wi-Fi.","answer":"Đ","explanation":"Router:\n Đúng - Router dẫn đường cho dữ liệu giữa các mạng, bao gồm mạng Internet.\n Đúng - Kết nối qua Internet yêu cầu dịch vụ của nhà cung cấp viễn thông, không chỉ sử dụng hub hay switch.\n Đúng - Router viễn thông thường có nhiều cổng WAN, trong khi router gia đình có một cổng WAN và tích hợp Wi-Fi."},{"label":"d","text":"Modem:\n- Có chức năng chuyển đổi tín hiệu từ tín hiệu số sang tín hiệu tương tự và ngược lại, thường dùng khi kết nối LAN với Internet.\n- Một số loại modem: modem quay số, modem ADSL, modem quang, modem GSM 3G…","answer":"Đ","explanation":"Modem\n Đúng - Modem chuyển đổi tín hiệu số và tín hiệu tương tự, cần thiết để kết nối LAN với Internet.\n Đúng - Các loại modem khác nhau phục vụ cho các công nghệ kết nối khác nhau."}]},{"id":"2","type":"tf","stem":"Thực hành kết nối máy tính với các thiết bị mạng sau đây đúng hay sai?","items":[{"label":"a","text":"Trên Windows 10 và 11, nhấp vào biểu tượng sóng trên thanh Taskbar để chọn và kết nối với trạm Wi-Fi gần.","answer":"Đ","explanation":"Đúng - Đây là cách kết nối Wi-Fi trên Windows 10 và 11."},{"label":"b","text":"Trên Android, vuốt màn hình từ trên xuống, chọn biểu tượng cài đặt, sau đó chọn biểu tượng kết nối Wi-Fi.","answer":"Đ","explanation":"Đúng - Đây là cách kết nối Wi-Fi trên Android."},{"label":"c","text":"Trên iOS, vuốt màn hình từ trên xuống (hoặc từ dưới lên), chọn biểu tượng để xem danh sách các trạm Wi-Fi gần, bao gồm tên, trạng thái bảo mật và thông tin kết nối.","answer":"Đ","explanation":"Đúng - Đây là cách kết nối Wi-Fi trên iOS."},{"label":"d","text":"Để kết nối thiết bị vào mạng LAN qua Wi-Fi, chọn trạm Wi-Fi thuộc LAN đó. Nếu trạm có biểu tượng khoá, yêu cầu nhập mật khẩu để kết nối. Sau khi nhập đúng, chọn Connect (hoặc Kết nối).","answer":"Đ","explanation":"Đúng - Đây là cách cơ bản để kết nối vào mạng Wi-Fi có bảo mật."}]}],"notes":[]},{"id":"bai-4","number":4,"title":"GIAO THỨC MẠNG","questions":[{"id":"1","type":"mcq","stem":"Giao thức mạng là gì?","choices":["Phần cứng trong mạng","Tập hợp các quy định về cách thức giao tiếp trong mạng","Phần mềm dùng để kiểm tra bảo mật","Một loại thiết bị mạng"],"answer":"B","explanation":"Giao thức mạng bao gồm các quy định về định dạng, ý nghĩa, và cách xử lý dữ liệu để đảm bảo việc truyền dữ liệu giữa các thiết bị trong mạng được thực hiện chính xác và hiệu quả."},{"id":"2","type":"mcq","stem":"Giao thức IP làm nhiệm vụ gì trong mạng?","choices":["Xác định địa chỉ MAC cho các thiết bị","Chia dữ liệu thành các gói nhỏ","Thiết lập địa chỉ và dẫn đường các gói dữ liệu","Kiểm tra lỗi trong truyền dữ liệu"],"answer":"C","explanation":"Giao thức IP quy định cách thiết lập địa chỉ cho các thiết bị trong mạng và cách dẫn đường cho các gói dữ liệu từ thiết bị gửi đến thiết bị nhận."},{"id":"3","type":"mcq","stem":"Có bao nhiêu phiên bản địa chỉ IP chính?","choices":["1","2","3","4"],"answer":"B","explanation":"Có hai phiên bản địa chỉ IP chính là IPv4 và IPv6."},{"id":"4","type":"mcq","stem":"Địa chỉ IP khác với địa chỉ MAC ở điểm nào?","choices":["IP là địa chỉ phần cứng, MAC là địa chỉ logic","IP là địa chỉ tạm thời, MAC là địa chỉ cố định","IP là địa chỉ của giao diện mạng, MAC là địa chỉ của thiết bị vật lý","IP là địa chỉ trong mạng LAN, MAC là địa chỉ trong mạng WAN"],"answer":"C","explanation":"Địa chỉ IP xác định vị trí của thiết bị trên mạng, trong khi địa chỉ MAC là địa chỉ vật lý của card mạng của thiết bị."},{"id":"5","type":"mcq","stem":"Router trong mạng đóng vai trò gì?","choices":["Chia sẻ tài nguyên mạng","Chuyển tiếp bưu phẩm dữ liệu","Kiểm tra lỗi dữ liệu","Tạo và quản lý kết nối VPN"],"answer":"B","explanation":"Router chuyển tiếp các gói dữ liệu giữa các mạng khác nhau, giống như cách bưu cục chuyển tiếp bưu phẩm."},{"id":"6","type":"mcq","stem":"Giao thức nào đảm bảo dữ liệu được truyền đến đúng ứng dụng và theo thứ tự?","choices":["IP","TCP","UDP","HTTP"],"answer":"B","explanation":"Giao thức TCP đảm bảo rằng dữ liệu đến đúng ứng dụng và theo đúng thứ tự bằng cách chia dữ liệu thành các gói, xác nhận gửi và gửi lại nếu cần thiết."},{"id":"7","type":"mcq","stem":"Giao thức TCP cung cấp cơ chế gì để đảm bảo truyền dữ liệu tin cậy?","choices":["Phát hiện và sửa lỗi","Chuyển đổi địa chỉ IP","Chuyển đổi địa chỉ IP","Phân phối tải giữa các máy chủ"],"answer":"A","explanation":"TCP cung cấp cơ chế xác nhận gửi lại dữ liệu khi cần để đảm bảo dữ liệu được truyền tin cậy và không bị mất mát.","reviewNote":"Hai phương án B và C trùng nhau trong nguồn; nên chỉnh sửa ngân hàng câu hỏi."},{"id":"8","type":"mcq","stem":"Giao thức nào thường được sử dụng cùng với IP để quản lý kết nối và truyền dữ liệu trong Internet?","choices":["FTP","SMTP","TCP","DHCP"],"answer":"C","explanation":"TCP thường được sử dụng cùng với IP (trong bộ giao thức TCP/IP) để quản lý kết nối và truyền dữ liệu một cách tin cậy trên Internet."},{"id":"9","type":"mcq","stem":"Giao thức nào không đảm bảo dữ liệu được truyền đúng thứ tự và có thể mất mát dữ liệu?","choices":["IP","TCP","UDP","HTTP"],"answer":"C","explanation":"Giao thức UDP (User Datagram Protocol) không đảm bảo dữ liệu được truyền đúng thứ tự và có thể bị mất mát, nhưng nó nhanh hơn TCP do không có cơ chế kiểm tra và xác nhận."},{"id":"10","type":"mcq","stem":"Trong mô hình OSI, giao thức IP hoạt động tại tầng nào?","choices":["Tầng ứng dụng","Tầng truyền tải","Tầng mạng","Tầng liên kết dữ liệu"],"answer":"C","explanation":"Giao thức IP hoạt động tại tầng mạng (Layer 3) của mô hình OSI, nơi nó chịu trách nhiệm định địa chỉ và định tuyến các gói dữ liệu giữa các mạng khác nhau."},{"id":"1","type":"tf","stem":"Các phát biểu sau đúng hay sai về Giao thức IP và TCP?","items":[{"label":"a","text":"Giao thức IP đảm bảo dữ liệu được truyền đến ứng dụng cụ thể trên máy.","answer":"S","explanation":"Sai: Giao thức IP không đảm bảo dữ liệu đến đúng ứng dụng; nhiệm vụ này thuộc về giao thức TCP."},{"label":"b","text":"Có hai loại địa chỉ IP là IPv4 và IPv6.","answer":"Đ","explanation":"Đúng: Có hai loại địa chỉ IP chính là IPv4 và IPv6, sử dụng để định danh các thiết bị trên mạng."},{"label":"c","text":"Địa chỉ IP và địa chỉ MAC là giống nhau.","answer":"S","explanation":"Sai: Địa chỉ IP là địa chỉ logic được sử dụng để định tuyến dữ liệu, trong khi địa chỉ MAC là địa chỉ vật lý của card mạng."},{"label":"d","text":"Router đóng vai trò như các bưu cục chuyển tiếp bưu phẩm.","answer":"Đ","explanation":"Đúng: Router hoạt động giống như bưu cục, chuyển tiếp các gói dữ liệu giữa các mạng khác nhau, giúp dữ liệu đến đúng đích."}]},{"id":"2","type":"tf","stem":"Phát biểu sau đúng hay sai về Giao thức TCP?","items":[{"label":"a","text":"Giao thức TCP chỉ đảm bảo chuyển dữ liệu giữa các mạng mà không đảm bảo truyền dữ liệu theo thứ tự.","answer":"S","explanation":"Sai: Giao thức TCP không chỉ đảm bảo chuyển dữ liệu mà còn đảm bảo rằng dữ liệu đến đúng ứng dụng và theo thứ tự."},{"label":"b","text":"Giao thức TCP cung cấp cơ chế xác nhận gửi lại dữ liệu khi cần.","answer":"Đ","explanation":"Đúng: TCP cung cấp cơ chế xác nhận gửi lại dữ liệu khi cần, để đảm bảo tính tin cậy trong truyền dữ liệu."},{"label":"c","text":"TCP chia dữ liệu thành các gói để tận dụng đường truyền.","answer":"Đ","explanation":"Đúng: TCP chia dữ liệu thành các gói nhỏ để tối ưu hóa việc sử dụng băng thông và tăng hiệu quả truyền tải."},{"label":"d","text":"TCP không phân biệt giữa các ứng dụng khác nhau khi truyền dữ liệu.","answer":"S","explanation":"Sai: TCP sử dụng các cổng ứng dụng để phân biệt giữa các ứng dụng khác nhau khi truyền dữ liệu, đảm bảo dữ liệu được gửi đến đúng ứng dụng."}]}],"notes":[]},{"id":"bai-5","number":5,"title":"THỰC HÀNH CHIA SẺ TÀI NGUYÊN TRÊN MẠNG","questions":[{"id":"1","type":"mcq","stem":"Để thiết lập chế độ mạng riêng tư và cho phép chia sẻ tệp và máy in, bước đầu tiên cần làm là gì?","choices":["Tắt tạm thời tường lửa","Thiết lập chế độ mạng riêng","Cho phép các máy khác nhìn thấy","Mở chức năng thiết lập chia sẻ nâng cao"],"answer":"B","explanation":"Thiết lập chế độ mạng riêng giúp các thiết bị trong mạng cục bộ có thể nhìn thấy nhau và chia sẻ tài nguyên dễ dàng."},{"id":"2","type":"mcq","stem":"Thư mục công cộng trên hệ thống được thiết lập ở đâu?","choices":["C:\\Users\\Public","C:\\Windows\\Public","C:\\Program Files\\Public","C:\\Documents\\Public"],"answer":"A","explanation":"Thư mục công cộng thường được đặt trong thư mục người dùng (Users) để dễ dàng truy cập và chia sẻ."},{"id":"3","type":"mcq","stem":"Để tạm thời dừng tường lửa, bạn vào phần nào trong Windows Security?","choices":["Device Security","Firewall & Network Protection","App & Browser Control","Virus & Threat Protection"],"answer":"B","explanation":"Trong Firewall & Network Protection, bạn có thể quản lý cài đặt tường lửa, bao gồm cả việc tạm dừng nó."},{"id":"4","type":"mcq","stem":"Để chia sẻ thư mục trên MAY_1, bước nào sau đây là đúng?","choices":["Chọn thư mục, nhấp chuột phải, chọn Properties, sau đó chọn Sharing","Chọn thư mục, nhấp chuột phải, chọn Share","Mở thư mục, sau đó chọn Share","Chọn thư mục, sau đó chọn Add to Network"],"answer":"A","explanation":"Để chia sẻ thư mục, bạn cần vào Properties và sau đó chọn thẻ Sharing để thiết lập chia sẻ."},{"id":"5","type":"mcq","stem":"Để thêm người dùng vào danh sách chia sẻ, bạn cần làm gì?","choices":["Chọn thư mục, sau đó chọn Add User","Trong thẻ Sharing, chọn Add sau khi chọn Everyone","Nhấp chuột phải lên thư mục, chọn Add to Share List","Mở thư mục, chọn Add User"],"answer":"B","explanation":"Bạn cần chọn Everyone từ danh sách người dùng và sau đó thêm họ vào danh sách chia sẻ."},{"id":"6","type":"mcq","stem":"Bước cuối cùng để hủy bỏ chia sẻ thư mục là gì?","choices":["Nhấp chuột phải lên thư mục, chọn Stop Sharing","Nhấp chuột phải lên thư mục, chọn Stop Sharing","Xóa thư mục từ mạng","Chọn thư mục và nhấp chuột vào Remove from Share"],"answer":"A","explanation":"Để hủy bỏ chia sẻ thư mục, bạn cần bỏ chọn ô Share this folder trong cài đặt Advanced Sharing.","reviewNote":"Hai phương án A và B trùng nhau; không tính điểm câu này để tránh ảnh hưởng kết quả.","excludeScore":true},{"id":"7","type":"mcq","stem":"Để chia sẻ máy in trên mạng, bước đầu tiên là gì?","choices":["Mở phần mềm máy in","Tìm máy in trong Control Panel","Cài đặt lại máy in","Chọn Printer properties"],"answer":"B","explanation":"Bạn cần vào Control Panel để tìm máy in, sau đó thiết lập chia sẻ máy in."},{"id":"8","type":"mcq","stem":"Sau khi tìm thấy máy in mạng, bạn làm gì tiếp theo để chia sẻ nó?","choices":["Chọn máy in, sau đó chọn Share","Chọn máy in, sau đó chọn Printer properties và thiết lập chia sẻ","Nhấp chuột phải lên máy in, chọn Share","Kết nối máy in với máy tính khác"],"answer":"B","explanation":"Để chia sẻ máy in, bạn cần vào Printer properties và chọn tùy chọn chia sẻ."},{"id":"9","type":"mcq","stem":"Để kết nối với máy in mạng từ máy tính khác, bạn cần làm gì?","choices":["Tìm máy in trong phần Devices","Vào phần Add device và tìm máy in","Nhấp chuột phải lên máy in, chọn Connect","Chọn máy in từ danh sách và nhấp chuột vào Add"],"answer":"B","explanation":"Bạn cần vào phần Add device để thêm máy in mạng vào danh sách thiết bị của máy tính."},{"id":"10","type":"mcq","stem":"Khi chọn “The printer that I want isn’t listed” trong quá trình kết nối máy in mạng, bạn cần làm gì tiếp theo?","choices":["Chọn máy in từ danh sách và nhấp chuột vào Add","Nhập địa chỉ IP của máy in","Sử dụng chức năng Browse để tìm máy in","Cài đặt lại driver máy in"],"answer":"C","explanation":"Nếu máy in không xuất hiện trong danh sách, bạn cần sử dụng chức năng Browse để tìm kiếm máy in mạng theo địa chỉ hoặc tên mạng."},{"id":"1","type":"tf","stem":"Để chia sẻ tệp và thư mục trên mạng cục bộ, bạn cần thực hiện các bước sau đây đúng hay sai?","items":[{"label":"a","text":"Thiết lập chế độ mạng riêng.","answer":"Đ","explanation":"Đúng: Chế độ mạng riêng giúp bảo mật và chỉ cho phép các máy tính trong mạng nội bộ kết nối và chia sẻ."},{"label":"b","text":"Thiết lập chia sẻ thư mục công cộng.","answer":"Đ","explanation":"Đúng: Chia sẻ thư mục công cộng là cần thiết để các máy khác có thể truy cập tệp và thư mục."},{"label":"c","text":"Bật tường lửa để bảo vệ an ninh mạng.","answer":"S","explanation":"Sai: Trong quá trình thiết lập chia sẻ, thường tường lửa được tắt tạm thời để không chặn các kết nối.","excludeScore":true},{"label":"d","text":"Cho phép các máy khác trong mạng có thể phát hiện và chia sẻ tệp và máy in.","answer":"Đ","explanation":"Đúng: Cho phép các máy khác phát hiện và chia sẻ là bước quan trọng để các máy có thể kết nối và sử dụng tài nguyên."}],"reviewNote":"Ý c) trong nguồn có đáp án không phù hợp với nguyên tắc bảo mật thông thường. Không tính điểm ý c) cho đến khi giáo viên xác minh."},{"id":"2","type":"tf","stem":"Quy trình kết nối máy in mạng từ các máy tính khác bao gồm các bước sau đúng hay sai?","items":[{"label":"a","text":"Tìm máy in mạng và chọn \"Add device\".","answer":"Đ","explanation":"Đúng: Đây là bước đầu tiên để tìm và thêm máy in mạng vào hệ thống."},{"label":"b","text":"Sau khi thêm máy in, chọn \"The printer that I want isn’t listed\" để tiếp tục.","answer":"Đ","explanation":"Đúng: Nếu máy in không tự động hiển thị, bạn cần chọn tùy chọn này để tìm kiếm thủ công."},{"label":"c","text":"Chọn \"Browse\" để tìm và thêm máy in mạng.","answer":"Đ","explanation":"Đúng: \"Browse\" giúp bạn duyệt và tìm máy in mạng mà bạn muốn kết nối."},{"label":"d","text":"Sử dụng máy in mạng ngay sau khi thêm máy in vào danh sách.","answer":"Đ","explanation":"Đúng: Sau khi hoàn tất cài đặt, bạn có thể sử dụng máy in mạng ngay lập tức."}]}],"notes":[]},{"id":"bai-6","number":6,"title":"GIAO TIẾP VÀ ỨNG XỬ TRONG KHÔNG GIAN MẠNG","questions":[{"id":"1","type":"mcq","stem":"Khái niệm không gian mạng là gì?","choices":["Môi trường truyền thông không dây","Môi trường được tạo ra nhờ các mạng máy tính","Môi trường giao tiếp thông qua điện thoại","Môi trường chỉ dành cho việc chơi game"],"answer":"B","explanation":"Không gian mạng là môi trường được tạo ra nhờ các mạng máy tính, cho phép người dùng kết nối và giao tiếp với nhau."},{"id":"2","type":"mcq","stem":"Một trong những ưu điểm của giao tiếp trong không gian mạng là gì?","choices":["Chi phí cao","Khó khăn trong việc tìm kiếm thông tin","Mở rộng kết nối xã hội","Thiếu sự bảo mật"],"answer":"C","explanation":"Một trong những ưu điểm của giao tiếp trong không gian mạng là khả năng mở rộng kết nối xã hội, giúp người dùng dễ dàng kết nối với nhiều người khác."},{"id":"3","type":"mcq","stem":"Một trong những nhược điểm của giao tiếp trong không gian mạng là gì?","choices":["Tính tiện lợi","Thiếu tín hiệu phi ngôn ngữ","Sử dụng công cụ giao tiếp đa dạng","Tiết kiệm thời gian"],"answer":"B","explanation":"Giao tiếp trong không gian mạng thiếu tín hiệu phi ngôn ngữ như ngôn ngữ cơ thể và giọng điệu, khiến việc hiểu đúng ý nghĩa của thông điệp trở nên khó khăn."},{"id":"4","type":"mcq","stem":"Điều nào sau đây không phải là cách ứng xử nhân văn khi giao tiếp trong không gian mạng?","choices":["Tôn trọng người khác","Sử dụng ngôn ngữ khiêu khích","Thấu hiểu, cảm thông","Lịch sự, sử dụng ngôn từ đúng mực"],"answer":"B","explanation":"Sử dụng ngôn ngữ khiêu khích không phải là cách ứng xử nhân văn; ngược lại, nó có thể gây tổn thương cho người khác."},{"id":"5","type":"mcq","stem":"Khi giao tiếp trong không gian mạng, tại sao nên đọc kĩ bài viết của người khác trước khi đưa ra ý kiến của mình?","choices":["Để tránh lỗi chính tả","Để hiểu rõ nội dung và tránh hiểu lầm","Để làm bài viết của mình dài hơn","Để có thể phản đối mạnh mẽ hơn"],"answer":"B","explanation":"Đọc kĩ bài viết của người khác giúp chúng ta hiểu rõ nội dung, tránh hiểu lầm và đưa ra phản hồi phù hợp."},{"id":"6","type":"mcq","stem":"Vì sao nên kiểm tra tính chính xác của thông tin trước khi chia sẻ trên không gian mạng?","choices":["Để bảo vệ thiết bị của mình","Để đảm bảo không làm tổn hại đến danh tiếng hoặc quyền riêng tư của người khác","Để có thêm lượt thích (like)","Để tiết kiệm thời gian"],"answer":"B","explanation":"Kiểm tra tính chính xác của thông tin giúp đảm bảo không làm tổn hại đến danh tiếng hoặc quyền riêng tư của người khác."},{"id":"7","type":"mcq","stem":"Tại sao giao tiếp trong không gian mạng có thể khó xây dựng mối quan hệ chặt chẽ?","choices":["Vì các công cụ giao tiếp hạn chế","Vì thiếu tín hiệu phi ngôn ngữ và cảm xúc","Vì chi phí cao","Vì dễ bị lộ thông tin cá nhân"],"answer":"B","explanation":"Giao tiếp trong không gian mạng thiếu các tín hiệu phi ngôn ngữ và cảm xúc, điều này làm cho việc xây dựng mối quan hệ chặt chẽ trở nên khó khăn."},{"id":"8","type":"mcq","stem":"Một hành động ứng xử nhân văn trong không gian mạng là gì?","choices":["Chia sẻ thông tin chưa kiểm chứng","Tôn trọng quyền riêng tư của người khác","Sử dụng ngôn ngữ thô tục","Phê phán mạnh mẽ người khác"],"answer":"B","explanation":"Tôn trọng quyền riêng tư của người khác là một hành động ứng xử nhân văn quan trọng trong không gian mạng."},{"id":"9","type":"mcq","stem":"Khi giao tiếp trong không gian mạng, việc cẩn trọng với ngôn từ là vì lý do nào?","choices":["Để tạo ấn tượng tốt","Để tránh làm tổn thương người khác","Để được nhiều người theo dõi","Để tăng lượt chia sẻ"],"answer":"B","explanation":"Cẩn trọng với ngôn từ giúp tránh làm tổn thương người khác và duy trì một môi trường giao tiếp lịch sự và tôn trọng."},{"id":"10","type":"mcq","stem":"Khi gặp tình huống khó xử trong giao tiếp mạng, nên làm gì?","choices":["Phớt lờ tình huống","Phản ứng ngay lập tức","Bình tĩnh và tôn trọng ý kiến người khác","Gây tranh cãi để thu hút sự chú ý"],"answer":"C","explanation":"Bình tĩnh và tôn trọng ý kiến người khác là cách xử lý tốt nhất trong các tình huống khó xử, giúp duy trì một không gian giao tiếp lành mạnh và tôn trọng."},{"id":"1","type":"tf","stem":"Phát biểu sau đây đúng hay sai về Ưu điểm và nhược điểm của giao tiếp trong không gian mạng?","items":[{"label":"a","text":"Giao tiếp trong không gian mạng thiếu tín hiệu phi ngôn ngữ.","answer":"Đ","explanation":"Đúng - Giao tiếp trong không gian mạng thường thiếu tín hiệu phi ngôn ngữ như cử chỉ, biểu cảm khuôn mặt."},{"label":"b","text":"Không gian mạng giúp tiết kiệm thời gian và chi phí trong giao tiếp.","answer":"Đ","explanation":"Đúng - Giao tiếp trong không gian mạng thường tiết kiệm thời gian và chi phí so với giao tiếp trực tiếp."},{"label":"c","text":"Mối quan hệ được xây dựng trong không gian mạng thường chặt chẽ hơn so với giao tiếp trực tiếp.","answer":"S","explanation":"Sai - Mối quan hệ trong không gian mạng thường khó xây dựng chặt chẽ hơn so với giao tiếp trực tiếp."},{"label":"d","text":"Công cụ giao tiếp trong không gian mạng thường ít đa dạng.","answer":"S","explanation":"Sai - Không gian mạng cung cấp nhiều công cụ giao tiếp đa dạng như email, chat, video call, mạng xã hội,..."}]},{"id":"2","type":"tf","stem":"Ứng xử nhân văn khi giao tiếp trong không gian mạng sau đây đúng hay sai?","items":[{"label":"a","text":"Thể hiện sự tôn trọng người khác là một cách ứng xử nhân văn trong không gian mạng.","answer":"Đ","explanation":"Đúng - Tôn trọng người khác là một trong những nguyên tắc cơ bản của ứng xử nhân văn."},{"label":"b","text":"Việc sử dụng ngôn từ khiêu khích hoặc phân biệt chủng tộc là chấp nhận được trong một số tình huống.","answer":"S","explanation":"Sai - Sử dụng ngôn từ khiêu khích hoặc phân biệt chủng tộc không bao giờ được chấp nhận trong không gian mạng."},{"label":"c","text":"Kiểm tra tính chính xác của thông tin trước khi chia sẻ là không cần thiết trong không gian mạng.","answer":"S","explanation":"Sai - Kiểm tra tính chính xác của thông tin là rất quan trọng để tránh làm tổn hại đến người khác."},{"label":"d","text":"Hỗ trợ người khác phát triển là một biểu hiện của ứng xử nhân văn.","answer":"Đ","explanation":"Đúng - Hỗ trợ người khác phát triển là một trong những biểu hiện của tinh thần nhân văn."}]}],"notes":[]},{"id":"bai-7","number":7,"title":"HTML VÀ CẤU TRÚC TRANG WEB","questions":[{"id":"1","type":"mcq","stem":"Trên trang HTML, thẻ p có ý nghĩa gì?","choices":["Đoạn văn bản.","Tiêu đề trang web.","Tiêu đề văn bản.","Một câu trích dẫn ngắn."],"answer":"A","explanation":""},{"id":"2","type":"mcq","stem":"Phát biểu nào sau đây sai?","choices":["Một phần tử HTML được định nghĩa bởi thẻ bắt đầu, thẻ kết thúc và phần nội dung nằm giữa cặp thẻ này.","Dòng đầu tiên của mỗi tệp HTML có dạng <!DOCTYPE html> có vai trò thông báo kiểu của tệp là html và được xem là phần tử HTML.","<br> là thẻ đơn.","HTML không nhận biết ký tự xuống dòng (nhấn phím Enter) để kết thúc đoạn văn bản như các phần mềm soạn thảo văn bản thông thường."],"answer":"B","explanation":""},{"id":"3","type":"mcq","stem":"Phát biểu nào sau đây đúng?","choices":["Phần tử <meta> nằm trong phần tử <body> và được dùng để mô tả các thông tin bổ sung của trang web như cách mã hóa Unicode, từ khóa dùng để tìm kiếm trang, tên tác giả trang web.","Trong sơ đồ hình cây HTML, phần tử <head> là phần tử gốc (root).","Phần tử <title> nằm trong <head> và phải là văn bản thường, không được phép chứa các phần tử con.","Phần tử <html> là không bắt buộc."],"answer":"C","explanation":""},{"id":"4","type":"mcq","stem":"HTML là gì?","choices":["Ngôn ngữ lập trình siêu văn bản.","Ngôn ngữ thiết kế siêu văn bản.","Ngôn ngữ đánh dấu siêu văn bản.","Ngôn ngữ trình bày siêu văn bản."],"answer":"C","explanation":""},{"id":"5","type":"mcq","stem":"Phần mở rộng của trang HTML là","choices":[".hltm.",".hml.",".htl.",".htm."],"answer":"D","explanation":""},{"id":"6","type":"mcq","stem":"Nội dung trên trang HTML bao gồm phần văn bản (text) và các kí tự đánh dấu đặc biệt nằm trong cặp dấu","choices":["\"(\", \")\".","\"{\", \"}\".","\"<\", \">\".","\"\\\\\", \"\\\\\"."],"answer":"C","explanation":""},{"id":"7","type":"mcq","stem":"Phần tử HTML có ý nghĩa chú thích trong tệp HTML có dạng như thế nào?","choices":["!-- chú thích --!.","<!-- chú thích -->.","// chú thích.","{...chú thích...}."],"answer":"B","explanation":""},{"id":"8","type":"mcq","stem":"Phương án nào sau đây là tên của một phần mềm soạn thảo HTML?","choices":["Mozilla Firefox.","w3schools.com.","Spotify.","Sublime Text."],"answer":"D","explanation":""},{"id":"9","type":"mcq","stem":"Phần mềm tương tự Notepad trên hệ điều hành Mac OS là","choices":["TextEdit.","Sublime Text.","HyperText.","Notepad++."],"answer":"A","explanation":""},{"id":"10","type":"mcq","stem":"Phiên bản hiện tại của HTML là?","choices":["HTML4","HTML5.","HTML6.","HTML7."],"answer":"B","explanation":""},{"id":"11","type":"mcq","stem":"Đoạn mã HTML của câu “The RMS Titanic, a luxury steamship, sank on April 15, 1912 after striking an iceberg.” là","choices":["<p>The <b>RMS Titanic</b>, a luxury steamship, sank on <i>April 15, 1912</i> after striking an iceberg.</p>.","<p>The <i>RMS Titanic</i>, a luxury steamship, sank on <u>April 15, 1912</u> after striking an iceberg.</p>.","<p>The <u>RMS Titanic</u>, a luxury steamship, sank on <b>April 15, 1912</b> after striking an iceberg.</p>.","<p>The <i>RMS Titanic</i>, a luxury steamship, sank on <b>April 15, 1912</b> after striking an iceberg.</p>."],"answer":"D","explanation":"","reviewNote":"Câu hỏi phụ thuộc định dạng hiển thị câu trích dẫn nhưng nguồn chỉ cung cấp câu chữ; nên bổ sung hình/định dạng mẫu."},{"id":"12","type":"mcq","stem":"Để phần mềm Notepad hiển thị và hỗ trợ soạn thảo HTML em cần thực hiện lệnh gì?","choices":["View ? Syntax ? HTML.","View ? H ? HTML.","Language ? H ? HTML.","Language ? Syntax ? HTML."],"answer":"C","explanation":"(Dựa theo đánh dấu đỏ trên ảnh gốc)","reviewNote":"Câu hỏi ghi Notepad nhưng phương án liên quan đến menu Language có thể thuộc Notepad++; nên kiểm tra lại trước khi sử dụng."},{"id":"13","type":"mcq","stem":"Thẻ nào trong HTML được sử dụng để định nghĩa từ viết tắt hoặc tóm tắt một đoạn nội dung nào đó?","choices":["<abbr>.","<wbr>.","<bdo>.","<svg>."],"answer":"A","explanation":""},{"id":"14","type":"mcq","stem":"HTML là viết tắt của ...","choices":["Hyperlinks and Text Markup Language.","Home Tool Markup Language.","Hyper Text Markup Language.","Home Text Markup Language."],"answer":"C","explanation":""},{"id":"15","type":"mcq","stem":"Thẻ <Map> dùng để làm gì?","choices":["Định nghĩa 1 bản đồ như google map hoạt động.","Chuyển đổi và định dạng mọi đối tượng trong nó như 1 bản đồ.","Để các thẻ <area> có thể vẽ những hình tròn, chữ nhật cho dễ thiết kế.","Để định nghĩa các vùng chứa đường dẫn trong phạm vi tấm hình."],"answer":"D","explanation":""},{"id":"16","type":"mcq","stem":"Thẻ <article> có mặt từ phiên bản IE nào trở lên.","choices":["IE 6","IE 7","IE 9","IE 11"],"answer":"C","explanation":""},{"id":"17","type":"mcq","stem":"Thuộc tính FOR trong thẻ <label> được dùng để","choices":["Thực thi Onclick của thẻ <input type=\"checkbox\"> trên label.","Thực thi Onclick của thẻ <input type=\"text\"> trên label.","Thực thi Onclick của thẻ <input> trên label.","Thực thi Onclick của 1 thẻ bất kỳ trên label."],"answer":"C","explanation":""},{"id":"18","type":"mcq","stem":"Thẻ <datalist> và <select> giống và khác nhau ở đâu?","choices":["Đều là dạng dropdownlist nhưng datalist cho phép nhập thêm dữ liệu.","Đều là dạng dropbox nhưng datalist cho phép nhập thêm dữ liệu.","Đều là dạng dropdownlist nhưng datalist là thẻ dữ liệu hỗ trợ cho <input type=\"text\"> để sổ danh sách.","Hai thẻ hoàn toàn khác nhau."],"answer":"C","explanation":""},{"id":"19","type":"mcq","stem":"Thẻ <ol> và <ul> khác nhau chỗ nào?","choices":["Hoàn toàn giống nhau","Chỉ khác ở cái tên nhưng đều chứa thẻ con <li>","<ul> dùng để tạo menu còn <ol> thì ít ai dùng","<ul> định nghĩa các <li> không thứ tự còn <ol> thì có thứ tự"],"answer":"D","explanation":""},{"id":"20","type":"mcq","stem":"Thẻ <caption> được dùng như thế nào","choices":["Để chứa 1 tiêu đề cho một chương mục, bài báo...","Để đánh dấu phần đầu của nội dung","Để sử dụng trong <table> làm tiêu đề","Để sử dụng trong <ul> làm tiêu đề"],"answer":"C","explanation":""},{"id":"21","type":"tf","stem":"Để làm việc hiệu quả với HTML và cấu trúc trang web, cần hiểu rõ về các phần tử và công cụ soạn thảo. Dưới đây là một số nhận định liên quan đến phần tử HTML và công cụ soạn thảo:","items":[{"label":"a","text":"Phần tử <title> nằm trong phần <body> và được sử dụng để đặt tiêu đề cho trang web.","answer":"S","explanation":"S (Phần tử <title> nằm trong phần <head>, không phải trong <body>, và được sử dụng để đặt tiêu đề cho trang web.)"},{"label":"b","text":"Phần mềm Notepad là một công cụ cơ bản nhưng hữu ích để soạn thảo mã HTML.","answer":"Đ","explanation":"Đ (Not ỳ.","cấp nguồn điện."],"answer":"B","explanation":"AI giúp máy tính thực hiện các công việc thường cần trí tuệ con người, không phải chỉ tính toán hoặc lưu tệp."},{"id":"2","type":"mcq","stem":"Hệ thống nào thể hiện khả năng học?","choices":["Đồng hồ báo giờ cố định.","Quạt quay theo mức đã chọn.","Gợi ý bài học từ kết quả đã làm.","Đèn bật bằng công tắc."],"answer":"C","explanation":"Hệ thống sử dụng kết quả học tập trước đó để điều chỉnh gợi ý là biểu hiện của khả năng học."},{"id":"3","type":"mcq","stem":"Phân biệt AI với tự động hóa cố định:","choices":["Mọi thiết bị tự động đều là AI.","AI luôn có cơ thể robot.","AI không dùng dữ liệu.","AI có thể suy luận từ tri thức."],"answer":"D","explanation":"AI có thể suy luận từ tri thức và dữ liệu; thiết bị tự động theo quy tắc cố định chưa chắc là AI."},{"id":"4","type":"mcq","stem":"Ứng dụng AI trong y tế là","choices":["hỗ trợ phân tích ảnh X-quang.","lưu ảnh vào thư mục.","in phiếu khám có sẵn.","bật màn hình máy tính."],"answer":"A","explanation":"AI có thể phân tích hình ảnh y khoa như ảnh X-quang để hỗ trợ nhân viên y tế."},{"id":"5","type":"mcq","stem":"Rủi ro khi gửi dữ liệu cá nhân cho AI:","choices":["Tăng kích thước màn hình.","Mất kết nối bàn phím.","Lộ thông tin riêng tư.","Giảm số cổng mạng."],"answer":"C","explanation":"Nhập dữ liệu cá nhân vào dịch vụ AI có thể dẫn đến rủi ro lộ thông tin riêng tư."},{"id":"6","type":"mcq","stem":"Vì sao AI hỗ trợ học tập cá nhân hóa?","choices":["Luôn thay thế giáo viên.","Điều chỉnh gợi ý theo kết quả học.","Luôn trả lời đúng.","Không cần dữ liệu học tập."],"answer":"B","explanation":"Học tập cá nhân hóa dựa vào kết quả và nhu cầu của từng học sinh để điều chỉnh gợi ý."},{"id":"7","type":"mcq","stem":"Thiết bị kết nối các mạng khác nhau:","choices":["Hub.","Switch.","Access point.","Router."],"answer":"D","explanation":"Router định tuyến gói tin giữa các mạng khác nhau."},{"id":"8","type":"mcq","stem":"Giao thức mạng là","choices":["quy tắc trao đổi dữ liệu.","tên nhà cung cấp mạng.","một loại dây cáp.","thiết bị phát sóng."],"answer":"A","explanation":"Giao thức mạng là tập hợp các quy tắc trao đổi dữ liệu giữa các thiết bị."},{"id":"9","type":"mcq","stem":"Tài nguyên phần cứng có thể chia sẻ:","choices":["Thư mụC.","Tệp văn bản.","Máy in.","Bài trình chiếu."],"answer":"C","explanation":"Máy in là tài nguyên phần cứng có thể chia sẻ trong mạng; lựa chọn A bị lỗi định dạng trong tệp gốc.","reviewNote":"Phương án A trong tệp gốc bị lỗi định dạng (\"Thư mụC.\"). Cần đối chiếu văn bản nguồn trước khi dùng đề này."},{"id":"10","type":"mcq","stem":"Chỉ cho bạn xem, không sửa tệp gốc:","choices":["Cấp toàn quyền.","Cấp quyền Read.","Cấp quyền Read/Write.","Cho dùng tài khoản quản trị."],"answer":"B","explanation":"Quyền Read chỉ cho phép đọc hoặc xem, không cấp quyền sửa tệp gốc."},{"id":"11","type":"mcq","stem":"Dấu hiệu đáng nghi trong tin nhắn là","choices":["lời nhắc lịch học.","đường dẫn tài liệu đã xác minh.","thông báo từ giáo viên đã biết.","yêu cầu gửi OTP để nhận quà."],"answer":"D","explanation":"Tin nhắn yêu cầu cung cấp mã OTP để nhận quà là dấu hiệu lừa đảo cần cảnh giác."},{"id":"12","type":"mcq","stem":"Thẻ chứa nội dung chính của trang:","choices":["<body>.","<head>.","<title>.","<meta>."],"answer":"A","explanation":"Thẻ <body> chứa nội dung chính được hiển thị trên trang web."},{"id":"1","type":"tf","stem":"Phòng máy cần mạng dây và Wi-Fi.","items":[{"label":"a","text":"Switch nối các máy tính trong LAN.","answer":"Đ","explanation":"Đúng. Switch kết nối các thiết bị trong cùng mạng LAN và chuyển tiếp dữ liệu."},{"label":"b","text":"Access point chỉ nối thiết bị bằng cáp.","answer":"S","explanation":"Sai. Access point chủ yếu giúp thiết bị kết nối không dây qua Wi-Fi."},{"label":"c","text":"Router định tuyến giữa các mạng khác nhau.","answer":"Đ","explanation":"Đúng. Router chuyển tiếp gói dữ liệu giữa các mạng."},{"label":"d","text":"Để thêm Wi-Fi cho LAN có sẵn, có thể nối access point vào switch.","answer":"Đ","explanation":"Đúng. Access point có thể nối vào switch để cung cấp thêm Wi-Fi cho mạng LAN."}]},{"id":"2","type":"tf","stem":"Tải một tệp qua kết nối TCP/IP.","items":[{"label":"a","text":"IP có vai trò đánh địa chỉ và định tuyến.","answer":"Đ","explanation":"Đúng. IP chịu trách nhiệm định địa chỉ và định tuyến gói tin."},{"label":"b","text":"TCP không có cơ chế yêu cầu truyền lại.","answer":"S","explanation":"Sai. TCP có cơ chế phát hiện dữ liệu thiếu và truyền lại."},{"label":"c","text":"MAC dùng để định tuyến xuyên Internet như địa chỉ IP.","answer":"S","explanation":"Sai. Địa chỉ MAC được dùng ở phạm vi liên kết mạng cục bộ, không thay cho IP để định tuyến xuyên Internet."},{"label":"d","text":"Khi mất một phần dữ liệu, TCP có thể yêu cầu truyền lại để nhận đủ tệp.","answer":"Đ","explanation":"Đúng. TCP dùng cơ chế xác nhận và truyền lại khi mất dữ liệu."}]},{"id":"3","type":"tf","stem":"Lan nhận link lạ yêu cầu OTP để nhận quà.","items":[{"label":"a","text":"Yêu cầu OTP qua tin nhắn lạ là dấu hiệu rủi ro.","answer":"Đ","explanation":"Đúng. Yêu cầu mã OTP qua đường link lạ có nguy cơ lừa đảo."},{"label":"b","text":"OTP có thể chia sẻ công khai như biệt danh.","answer":"S","explanation":"Sai. OTP là mã bảo mật, không nên tiết lộ cho người khác."},{"label":"c","text":"Tên tài khoản giống người quen chưa đủ để tin tin nhắn.","answer":"Đ","explanation":"Đúng. Tên tài khoản có thể bị giả mạo; cần xác minh nguồn tin."},{"label":"d","text":"Lan nên nhập thử OTP vào link rồi mới hỏi giáo viên.","answer":"S","explanation":"Sai. Không thử nhập OTP vào đường link không đáng tin cậy."}]},{"id":"4","type":"tf","stem":"Xét mã <head><title>Lớp 12</title></head> và <body><h1>Ôn tập</h1></body>.","items":[{"label":"a","text":"HTML là ngôn ngữ đánh dấu.","answer":"Đ","explanation":"Đúng. HTML là ngôn ngữ đánh dấu siêu văn bản."},{"label":"b","text":"body chứa nội dung hiển thị trong trang.","answer":"Đ","explanation":"Đúng. Nội dung hiển thị của trang nằm trong phần tử <body>."},{"label":"c","text":"Chữ “Lớp 12” là đề mục h1 trong trang.","answer":"S","explanation":"Sai. “Lớp 12” nằm trong <title>, còn đề mục <h1> là “Ôn tập”."},{"label":"d","text":"Để thêm đoạn văn, đặt <p>Em ôn Tin.</p> trong body.","answer":"Đ","explanation":"Đúng. Đoạn văn hiển thị trong trang thường được đặt trong thẻ <p> bên trong <body>."}]},{"id":"1","type":"essay","stem":"(1 điểm) Minh định nộp nguyên bài do AI viết, chưa kiểm chứng và đã tải thông tin cá nhân của bạn lên AI. Nêu hai rủi ro và hai cách xử lý phù hợp.","answer":null,"explanation":"Tự luận không bắt buộc trong chế độ ôn tập. Nếu có trả lời, em có thể nhờ giáo viên nhận xét."},{"id":"2","type":"essay","stem":"(1 điểm) Máy A tải tệp từ máy chủ khác mạng qua TCP/IP. Phân tích vai trò IP, router và TCP; giải thích cách xử lý khi dữ liệu đến thiếu hoặc sai thứ tự.","answer":null,"explanation":"Tự luận không bắt buộc trong chế độ ôn tập. Nếu có trả lời, em có thể nhờ giáo viên nhận xét."},{"id":"3","type":"essay","stem":"(1 điểm) Viết tệp HTML hoàn chỉnh: tiêu đề tab “Ôn tập Tin 12”, đề mục h1 “An toàn số”, đoạn văn “Kiểm chứng trước khi chia sẻ”.","answer":null,"explanation":"Tự luận không bắt buộc trong chế độ ôn tập. Nếu có trả lời, em có thể nhờ giáo viên nhận xét."}],"notes":["Đáp án phần trắc nghiệm của đề tổng hợp được bổ sung để luyện tập, KHÔNG có trong tài liệu gốc. Giáo viên nên kiểm tra trước khi sử dụng làm bài kiểm tra chính thức.","Chỉ cần hoàn thành 12 câu A–D và 16 ý Đúng/Sai là có thể nộp. Ba câu tự luận được phép để trống và không tính vào kết quả chấm tự động."],"answerOrigin":"Gợi ý đáp án được bổ sung để ôn tập; tài liệu gốc không có đáp án đề tổng hợp."},"provenance":"Trích nguyên văn từ tài liệu do giáo viên cung cấp; đáp án của 7 bài học theo tài liệu, chưa được phản biện toàn bộ."};
const STORAGE_KEY="on_tap_tin_12_source_2026_v1";
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const ALPHABET="ABCD";
const allLessons=[...BANK.lessons,BANK.exam];
const MINIMUM=70;
let saved={};
try{saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}")||{}}catch(e){saved={}}
if(typeof saved!=="object"||Array.isArray(saved))saved={};
saved.answers=(saved.answers&&typeof saved.answers==="object")?saved.answers:{};
saved.submitted=(saved.submitted&&typeof saved.submitted==="object")?saved.submitted:{};
saved.records=(saved.records&&typeof saved.records==="object")?saved.records:{};
let activeTab="all";
const formatDate=(s)=>{if(!s)return"—";let x=new Date(s);return Number.isFinite(x.getTime())?x.toLocaleString("vi-VN"):String(s)};
const now=()=>new Date().toISOString();
const formatPct=s=>s.total?(100*s.correct/s.total).toFixed(1).replace(".0",""):"0";
const passedScore=s=>s.total>0&&s.correct*100>MINIMUM*s.total;
function answerKey(q,sub){return q.type+"-"+q.id+(sub?"-"+sub:"")}
function answersFor(id){return saved.answers[id]||(saved.answers[id]={})}
function units(lesson){return lesson.questions.flatMap(q=>q.type==="tf"?q.items.map(s=>({key:answerKey(q,s.label),q,s})): [{key:answerKey(q),q,s:null}])}
function requiredUnits(lesson){return units(lesson).filter(({q})=>q.type!=="essay")}
function progress(lesson){const a=answersFor(lesson.id),u=requiredUnits(lesson);return{done:u.filter(it=>String(a[it.key]||"").trim()!=="").length,total:u.length}}
function score(lesson){let correct=0,total=0;const a=answersFor(lesson.id);for(const item of units(lesson)){
 const{q,s,key}=item,ans=s?s.answer:q.answer;if(!ans||s?.excludeScore||q.excludeScore)continue;
 total++;if(a[key]===ans)correct++;
}return{correct,total,pct:total?100*correct/total:0}}
// Tương thích với dữ liệu đã lưu từ phiên bản ôn tập cũ: chỉ ghi nhận nếu trước đó đã nộp.
if(!saved.migratedPathway){
 for(const l of allLessons){if(!saved.submitted[l.id]||saved.records[l.id])continue;
  const s=score(l),date=saved.submitted[l.id].iso||saved.submitted[l.id].time||now();
  saved.records[l.id]={attempts:1,bestCorrect:s.correct,bestTotal:s.total,bestPct:s.pct,
    passed:l.id!==BANK.exam.id&&passedScore(s),passedAt:passedScore(s)?date:null,
    completed:l.id===BANK.exam.id,lastCorrect:s.correct,lastTotal:s.total,lastPct:s.pct,lastAt:date};
 }
 saved.migratedPathway=true;
}
function record(id){return saved.records[id]||null}
function isSubmitted(id){return Boolean(saved.submitted[id])}
function completedCount(){return BANK.lessons.filter(l=>record(l.id)?.passed).length}
function isUnlocked(id){let index=allLessons.findIndex(l=>l.id===id);if(index<0)return false;return allLessons.slice(0,index).every(l=>record(l.id)?.passed)}
function canExit(){return isUnlocked(BANK.exam.id)&&Boolean(record(BANK.exam.id)?.completed)}
function nextLesson(id){let index=allLessons.findIndex(l=>l.id===id);return allLessons[index+1]||null}
function firstAvailable(){return [...allLessons].reverse().find(l=>isUnlocked(l.id))?.id||allLessons[0].id}
let active=allLessons.some(l=>l.id===saved.active&&isUnlocked(l.id))?saved.active:firstAvailable();
function persist(){try{saved.active=active;localStorage.setItem(STORAGE_KEY,JSON.stringify(saved))}catch(e){console.warn("Không thể lưu tiến độ trên trình duyệt",e)}}
function currentLesson(){return allLessons.find(l=>l.id===active&&isUnlocked(l.id))||allLessons[0]}
function types(lesson){let ts=[{id:"all",label:"Tất cả"}];if(lesson.questions.some(q=>q.type==="mcq"))ts.push({id:"mcq",label:"Trắc nghiệm A–D"});if(lesson.questions.some(q=>q.type==="tf"))ts.push({id:"tf",label:"Đúng / Sai"});if(lesson.questions.some(q=>q.type==="essay"))ts.push({id:"essay",label:"Tự luận"});return ts}
function count(lesson,type){return lesson.questions.filter(q=>q.type===type).length}
function renderSidebar(){return `<aside><div class="brand"><div class="brand-logo">12</div><div><div class="brand-name">TIN HỌC 12</div><div class="brand-sub">HÀNH TRÌNH CHINH PHỤC 7 BÀI</div></div></div><div class="section-caption">Lộ trình mở khóa</div><nav class="nav-list" aria-label="Chọn bài học">${allLessons.map(l=>{const p=progress(l),r=record(l.id),locked=!isUnlocked(l.id),passed=Boolean(r?.passed),finished=l.id===BANK.exam.id?Boolean(r?.completed):passed;
 return `<button class="lesson-nav ${l.id===active?"active":""} ${locked?"is-locked":""}" type="button" ${locked?"disabled":""} data-lesson="${l.id}" aria-current="${l.id===active?"page":"false"}"><span class="num">${locked?"🔒":l.number||"★"}</span><span class="nav-content"><span class="nav-title">${l.number?"Bài "+l.number+" · ":""}${esc(l.title)}</span><span class="nav-meta">${locked?"Chưa mở khóa":finished?(r?.bestTotal?`Đạt ${formatPct({correct:r.bestCorrect,total:r.bestTotal})}% · Đã mở khóa`:"Đã hoàn thành"):r?.attempts?`Chưa đạt · ${r.attempts} lần làm`:p.done?`${p.done}/${p.total} ý đã chọn`:"Sẵn sàng học"}</span></span><span class="nav-status">${locked?"🔐":finished?"✓":r?.attempts?"↻":""}</span></button>`}).join("")}</nav><div class="side-note"><b>🎯 Quy tắc vượt bài</b><br>Đạt <b>trên 70%</b> số câu/ý tính điểm để mở khóa bài tiếp theo.<br>Hoàn thành Bài 7 để mở Đề tổng hợp; nộp Đề tổng hợp để in phiếu thoát lớp.<br><br><b>Lưu ý:</b> Tiến độ chỉ lưu trên trình duyệt này.</div><button class="reset-profile" type="button" data-reset-all>Đổi học sinh / Xóa tiến độ</button><div class="sidebar-foot">Học offline · In kết quả tại máy</div></aside>`}
function renderCard(lesson,q,index,submitted){const a=answersFor(lesson.id), head=`<div class="q-head"><span class="q-index">CÂU ${esc(q.id)} ${q.reviewNote?'<span class="q-nobadge">Cần rà soát</span>':""}</span><span class="q-type">${q.type==="mcq"?"CHỌN 1 ĐÁP ÁN":q.type==="tf"?"ĐÚNG / SAI":"TỰ LUẬN"}</span></div><h3 class="q-stem">${esc(q.stem)}</h3>`;

 persist();activeTab="all";render();document.querySelector(".result")?.scrollIntoView({behavior:"smooth",block:"start"});
}
function ensureIdentity(){const name=String(saved.student||"").trim(),klass=String(saved.studentClass||"").trim();
 if(!name||!klass){alert("Trước khi in phiếu thoát lớp, hãy nhập đầy đủ HỌ VÀ TÊN và LỚP ở đầu trang.");document.getElementById(!name?"student-name":"student-class")?.focus();return false}
 return true;
}
function buildPrintReport(){const list=BANK.lessons.map(l=>{const r=record(l.id),valid=Boolean(r?.passed);return `<tr><td><b>Bài ${l.number}</b></td><td>${esc(l.title)}</td><td class="center">${r?.bestTotal?`${r.bestCorrect}/${r.bestTotal}`:"—"}</td><td class="center">${r?.bestTotal?formatPct({correct:r.bestCorrect,total:r.bestTotal})+"%":"—"}</td><td class="center">${valid?"ĐẠT":"CHƯA ĐẠT"}</td><td>${esc(formatDate(r?.passedAt))}</td></tr>`}).join("");
 const final=record(BANK.exam.id),examScore=final?.lastTotal?formatPct({correct:final.lastCorrect,total:final.lastTotal}):"—";
 const stamp=new Date().toLocaleString("vi-VN");
 return `<div class="print-topline">TIN HỌC 12 · PHIẾU GHI NHẬN KẾT QUẢ ÔN LUYỆN</div><h1>PHIẾU KẾT QUẢ THOÁT LỚP</h1><p class="print-sub">Hành trình ôn luyện 7 bài học và đề tổng hợp</p>
 <div class="print-ident"><div><b>Họ và tên học sinh:</b> ${esc(String(saved.student).trim())}</div><div><b>Lớp:</b> ${esc(String(saved.studentClass).trim())}</div><div><b>Ngày in:</b> ${esc(stamp)}</div></div>
 <h2>I. KẾT QUẢ TỪNG BÀI HỌC</h2><table class="print-table"><thead><tr><th>Bài</th><th>Nội dung ôn tập</th><th>Đúng / chấm</th><th>Tỷ lệ</th><th>Kết quả</th><th>Đạt lúc</th></tr></thead><tbody>${list}</tbody></table>
 <p class="print-small">Điều kiện đạt cho từng bài học: số câu/ý đúng <b>trên 70%</b> tổng số câu/ý được chấm. Bảng thể hiện kết quả tốt nhất đã ghi nhận. Các câu/ý thiếu đáp án hoặc cần rà soát không tính điểm.</p>
 <h2>II. KẾT QUẢ ĐỀ TỔNG HỢP</h2><table class="print-table"><tbody><tr><th>Trắc nghiệm</th><td>${final?.lastCorrect??"—"}/${final?.lastTotal??"—"} câu/ý được chấm (${examScore}%)</td></tr><tr><th>Ngày hoàn thành</th><td>${esc(formatDate(final?.completedAt||final?.lastAt))}</td></tr><tr><th>Tự luận</th><td>Không bắt buộc · Không chấm tự động</td></tr></tbody></table>
 <div class="print-conclusion"><b>TRẠNG THÁI: ĐÃ HOÀN THÀNH LỘ TRÌNH ÔN LUYỆN – ĐỦ ĐIỀU KIỆN THOÁT LỚP</b><p>Học sinh đã vượt qua 7 bài học theo quy tắc mở khóa và đã nộp đề tổng hợp.</p></div>
 <p class="print-small">Chú ý: Đáp án phần trắc nghiệm của Đề tổng hợp là gợi ý bổ sung vì tài liệu nguồn không có đáp án. Kết quả được tính và lưu cục bộ trên trình duyệt; phiếu này không phải xác nhận được giám sát hoặc chứng thực bởi máy chủ.</p>
 <div class="print-signs"><div><b>HỌC SINH</b><p>(Ký, ghi rõ họ tên)</p></div><div><b>GIÁO VIÊN XÁC NHẬN</b><p>(Ký, ghi rõ họ tên)</p></div></div>`;
}
function printExitReport(){if(!canExit()||!ensureIdentity())return;const report=document.getElementById("print-report");report.innerHTML=buildPrintReport();report.setAttribute("aria-hidden","false");window.print();}
function changeLesson(id){if(!isUnlocked(id))return;active=id;activeTab="all";persist();render();window.scrollTo({top:0,behavior:"instant"})}
function restartCurrent(){const l=currentLesson();
 // Nếu chưa đạt: làm lại ngay, không bắt học sinh xác nhận thêm.
 // Nếu đã đạt hoặc là đề tổng hợp: hỏi xác nhận để tránh xóa nhầm bài vừa làm.
 const failedLesson=isSubmitted(l.id)&&l.id!==BANK.exam.id&&!passedScore(score(l));
 if(!failedLesson&&!confirm("Làm lại bài này? Lựa chọn của lượt đang xem sẽ bị xóa, nhưng điểm cao nhất, số lần làm và các bài đã mở khóa vẫn được giữ lại."))return;
 saved.answers[l.id]={};delete saved.submitted[l.id];persist();activeTab="all";render();window.scrollTo({top:0,behavior:"instant"})}
function resetAll(){if(!confirm("Chuyển sang học sinh khác? Họ tên, lớp, tất cả đáp án, số lần làm và thành tích trên trình duyệt này sẽ bị XÓA. Hãy in phiếu kết quả cũ trước khi tiếp tục."))return;
 if(!confirm("XÁC NHẬN XÓA TOÀN BỘ LỘ TRÌNH? Không thể khôi phục từ trang web offline."))return;
 saved={answers:{},submitted:{},records:{},migratedPathway:true,student:"",studentClass:""};active=BANK.lessons[0].id;activeTab="all";persist();render();window.scrollTo({top:0,behavior:"instant"});
}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b||b.disabled)return;
 if(b.dataset.lesson){changeLesson(b.dataset.lesson);return}
 if(b.dataset.goNext){changeLesson(b.dataset.goNext);return}
 if(b.dataset.tab){activeTab=b.dataset.tab;retainScrollRender();return}
 if(b.hasAttribute("data-print")){printExitReport();return}
 if(b.hasAttribute("data-reset-all")){resetAll();return}
 const l=currentLesson(),a=answersFor(l.id);
 if(b.dataset.answer && !isSubmitted(l.id)){a[b.dataset.answer]=b.dataset.value;persist();retainScrollRender();return}
 if(b.hasAttribute("data-submit")){submitCurrent();return}
 if(b.hasAttribute("data-clear")){if(Object.keys(a).length&&confirm("Xóa toàn bộ đáp án đang chọn trong lượt làm bài này?")){saved.answers[l.id]={};persist();render()}return}
 if(b.hasAttribute("data-restart")){restartCurrent();return}
 if(b.hasAttribute("data-download")){downloadResults();return}
});
document.addEventListener("input",e=>{
 if(e.target.id==="student-name"){saved.student=e.target.value;persist();return}
 if(e.target.id==="student-class"){saved.studentClass=e.target.value;persist();return}
 if(e.target.matches("textarea[data-essay]")){const l=currentLesson();if(isSubmitted(l.id))return;answersFor(l.id)[e.target.dataset.essay]=e.target.value;persist();updateExamProgress()}
});
window.addEventListener("afterprint",()=>{const x=document.getElementById("print-report");x?.setAttribute("aria-hidden","true")});
persist();render();
</script>
</body>
</html>
